      <path d="M-33 -19 L-2 -34 L32 -16 L15 8 L-15 9 Z" fill="url(#gold)" opacity=".38"/>
      <path d="M31 -16 L37 17 L11 34 L-2 9 L15 8 Z" fill="url(#gold)" opacity=".31"/>
      <path d="M11 34 L-26 30 L-37 4 L-2 9 Z" fill="url(#gold)" opacity=".36"/>
      <path d="M-37 4 L-33 -19 L-2 -34 L-15 9 Z" fill="url(#gold)" opacity=".25"/>
    </g>
    <g transform="translate(605 112)">
      <circle r="72" fill="none" stroke="url(#gold)" stroke-width="5.5"/>
      <circle r="52" fill="none" stroke="url(#gold)" stroke-width="1.8" opacity=".65"/>
      <circle r="37" fill="none" stroke="url(#gold)" stroke-width="1.3" opacity=".52"/>
      <circle r="26" fill="url(#darkLens)" stroke="url(#gold)" stroke-width="1.2"/>
      <path d="M-100 0 H-72 M72 0 H100 M0 -100 V-72 M0 72 V100" class="goldStroke" stroke-width="1.8" opacity=".88"/>
      <path d="M-48 -22 C-27 -37 27 -37 48 -22 M-48 22 C-27 37 27 37 48 22" class="goldStroke" stroke-width="1" opacity=".58"/>
      <path d="M-94 -54 C-118 -38 -122 -14 -116 0 C-122 14 -118 38 -94 54" class="goldStroke" stroke-width="1" opacity=".48"/>
      <path d="M94 -54 C118 -38 122 -14 116 0 C122 14 118 38 94 54" class="goldStroke" stroke-width="1" opacity=".48"/>
      <circle cx="107" cy="-42" r="4.2" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
      <circle cx="99" cy="62" r="3.8" fill="none" stroke="url(#gold)" stroke-width="1.3"/>
    </g>

    <line x1="320" y1="235" x2="410" y2="235" stroke="url(#gold)" stroke-width="1.5" opacity=".65"/>
    <text x="435" y="255" class="brand" font-size="54" fill="url(#gold)">LowVolt</text>
    <line x1="615" y1="235" x2="705" y2="235" stroke="url(#gold)" stroke-width="1.5" opacity=".65"/>

    <text x="490" y="312" class="services" text-anchor="middle" font-size="18" fill="url(#gold)">
