      <path d="M-30 -17 L-2 -31 L29 -14 L14 7 L-14 8 Z" fill="url(#gold)" opacity=".38"/>
      <path d="M28 -14 L34 15 L10 31 L-2 8 L14 7 Z" fill="url(#gold)" opacity=".31"/>
      <path d="M10 31 L-24 27 L-34 3 L-2 8 Z" fill="url(#gold)" opacity=".36"/>
      <path d="M-34 3 L-30 -17 L-2 -31 L-14 8 Z" fill="url(#gold)" opacity=".25"/>
    </g>

    
    <g transform="translate(610 92)">
      <circle r="64" fill="none" stroke="url(#gold)" stroke-width="5"/>
      <circle r="47" fill="none" stroke="url(#gold)" stroke-width="1.8" opacity=".65"/>
      <circle r="34" fill="none" stroke="url(#gold)" stroke-width="1.3" opacity=".52"/>
      <circle r="24" fill="url(#darkLens)" stroke="url(#gold)" stroke-width="1.2"/>
      <circle r="10" fill="none" stroke="url(#gold)" stroke-width=".8" opacity=".48"/>
      <path d="M-91 0 H-64 M64 0 H91 M0 -91 V-64 M0 64 V91" class="goldStroke" stroke-width="1.8" opacity=".88"/>
      <path d="M-42 -20 C-24 -34 24 -34 42 -20 M-42 20 C-24 34 24 34 42 20" class="goldStroke" stroke-width="1" opacity=".58"/>
