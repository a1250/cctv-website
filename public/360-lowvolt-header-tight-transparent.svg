<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="360 LowVolt header logo">

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3D8A5"/>
      <stop offset="42%" stop-color="#DEC29B"/>
      <stop offset="72%" stop-color="#9B7A45"/>
      <stop offset="100%" stop-color="#F3D8A5"/>
    </linearGradient>
    <radialGradient id="darkLens" cx="48%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#F3D8A5"/>
      <stop offset="20%" stop-color="#9B7A45"/>
      <stop offset="46%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>
    <style>
      .num {
        font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
        font-weight: 200;
        letter-spacing: -9px;
      }
      .brand {
        font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
        font-weight: 300;
        letter-spacing: 14px;
      }
      .services {
        font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
        font-weight: 300;
        letter-spacing: 5px;
      }
      .goldStroke {
        stroke: url(#gold);
        stroke-linecap: round;
        stroke-linejoin: round;
