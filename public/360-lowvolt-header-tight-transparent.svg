      <path d="M86 -48 C108 -35 111 -13 106 0 C111 13 108 35 86 48" class="goldStroke" stroke-width="1" opacity=".48"/>
      <circle cx="96" cy="-38" r="4.2" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
      <circle cx="90" cy="55" r="3.8" fill="none" stroke="url(#gold)" stroke-width="1.3"/>
    </g>

    <line x1="720" y1="94" x2="770" y2="94" stroke="url(#gold)" stroke-width="1.6" opacity=".65"/>
    <text x="805" y="118" class="brand" font-size="58" fill="url(#gold)">LowVolt</text>
