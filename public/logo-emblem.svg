<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Outermost decorative ring -->
  <circle cx="40" cy="40" r="37" fill="none" stroke="rgba(212,184,150,0.18)" stroke-width="0.8"/>
  <!-- Outer ring -->
  <circle cx="40" cy="40" r="30" fill="none" stroke="rgba(212,184,150,0.38)" stroke-width="1.2"/>
  <!-- Main ring — the layered zero -->
  <circle cx="40" cy="40" r="22" fill="none" stroke="#d4b896" stroke-width="1.9"/>
  <!-- Inner ring -->
  <circle cx="40" cy="40" r="14" fill="none" stroke="rgba(212,184,150,0.55)" stroke-width="1"/>
  <!-- Innermost detail ring -->
  <circle cx="40" cy="40" r="7" fill="none" stroke="rgba(212,184,150,0.28)" stroke-width="0.8"/>
  <!-- Centre dot -->
  <circle cx="40" cy="40" r="2" fill="#d4b896"/>
  <!-- N tick — champagne, prominent -->
  <line x1="40" y1="2" x2="40" y2="9" stroke="#d4b896" stroke-width="1.9" stroke-linecap="round"/>
  <!-- S tick -->
  <line x1="40" y1="71" x2="40" y2="78" stroke="rgba(212,184,150,0.42)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- E tick -->
  <line x1="71" y1="40" x2="78" y2="40" stroke="rgba(212,184,150,0.42)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- W tick -->
  <line x1="2" y1="40" x2="9" y2="40" stroke="rgba(212,184,150,0.42)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
